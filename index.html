<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nombre de tu marca</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome para los iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <!-- Imagen de productos -->
        <section class="product-header">
            <img 
                src="images/productos.jpg" 
                alt="Productos de la marca"
                class="products-image"
            >
        </section>


        <!-- Contenido principal -->
        <section class="brand-section">

            <!-- Logo -->
            <div class="logo-container">
                <img 
                    src="images/neomuPP.png" 
                    alt="Logo de la marca"
                    class="logo"
                >
            </div>
            <h1>NeomuMX</h1>

            <!-- Subtexto -->
            <p class="description">
                Aquí puedes colocar una pequeña descripción de tu emprendimiento.
            </p>


            <!-- Redes sociales -->
            <div class="social-links">
                <a href="https://www.instagram.com/neomu.mx " target="_blank" aria-label="Instagram">
                    <i class="fa-brands fa-instagram"></i>
                </a>
                <a href="https://www.tiktok.com/@neomu.mx?_r=1&_t=ZS-99CMyndKjRd" target="_blank" aria-label="TikTok">
                    <i class="fa-brands fa-tiktok"></i>
                </a>
                <a href="https://www.facebook.com/share/198EB552gx/?mibextid=wwXIfr " target="_blank" aria-label="Facebook">
                    <i class="fa-brands fa-facebook-f"></i>
                </a>

            </div>

            <div class="buttons">
                <a href="https://www.whatsapp.com/catalog/5215560612004/?app_absent=0 " class="button">
                    Catálogo
                </a>
                <a href="https://wa.me/message/GXPOD7IIRLDHN1" class="button">
                    Realiza tu pedido
                </a>
            </div>
        </section>
    </main>
    <img 
        src="images/mumu_wink_pose.png" 
        alt="Mascota de la marca"
        class="mascot"
    >


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
